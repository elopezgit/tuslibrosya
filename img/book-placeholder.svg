<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="spineShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Book Background -->
  <rect width="400" height="500" fill="url(#bookCover)" />

  <!-- Subtle Paper Pages edge effect on right -->
  <rect x="388" y="6" width="6" height="488" rx="2" fill="#e2e8f0" opacity="0.4" />

  <!-- Spine Shadow -->
  <rect x="0" y="0" width="36" height="500" fill="url(#spineShadow)" />
  <line x1="36" y1="0" x2="36" y2="500" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Elegant Gold Foil Border -->
  <rect x="52" y="30" width="316" height="440" rx="4" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="58" y="36" width="304" height="428" rx="2" fill="none" stroke="url(#goldGradient)" stroke-width="0.75" stroke-opacity="0.25" />

  <!-- Corner Ornaments -->
  <circle cx="58" cy="36" r="3" fill="url(#goldGradient)" opacity="0.6" />
  <circle cx="362" cy="36" r="3" fill="url(#goldGradient)" opacity="0.6" />
  <circle cx="58" cy="464" r="3" fill="url(#goldGradient)" opacity="0.6" />
  <circle cx="362" cy="464" r="3" fill="url(#goldGradient)" opacity="0.6" />

  <!-- Center Open Book Icon -->
  <g transform="translate(160, 160)">
    <path d="M40 5 C25 -5, 5 0, 0 5 L0 60 C5 55, 25 50, 40 60 C55 50, 75 55, 80 60 L80 5 C75 0, 55 -5, 40 5 Z" 
          fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="40" y1="5" x2="40" y2="60" stroke="url(#goldGradient)" stroke-width="2.5" />
    <!-- Book Bookmark Ribbon -->
    <path d="M40 0 L40 32 L46 26 L52 32 L52 0 Z" fill="#ef4444" opacity="0.9" />
  </g>

  <!-- Typography -->
  <text x="210" y="275" 
        font-family="'Outfit', system-ui, -apple-system, sans-serif" 
        font-size="19" 
        font-weight="800" 
        fill="#f8fafc" 
        letter-spacing="2" 
        text-anchor="middle">
    TUS LIBROS YA
  </text>

  <text x="210" y="305" 
        font-family="'Outfit', system-ui, -apple-system, sans-serif" 
        font-size="12" 
        font-weight="500" 
        fill="#94a3b8" 
        letter-spacing="1" 
        text-anchor="middle">
    LIBRO EN CATÁLOGO
  </text>

  <line x1="140" y1="330" x2="280" y2="330" stroke="url(#goldGradient)" stroke-width="1" stroke-opacity="0.4" />

  <text x="210" y="360" 
        font-family="'Outfit', system-ui, -apple-system, sans-serif" 
        font-size="11" 
        font-weight="400" 
        fill="#64748b" 
        letter-spacing="0.5" 
        text-anchor="middle">
    Foto de portada no disponible
  </text>
</svg>
